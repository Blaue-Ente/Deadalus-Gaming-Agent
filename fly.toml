# fly.io — from this directory: fly launch --copy-config --yes && fly deploy
app = "daedalus"
primary_region = "fra"

[build]

[env]
  DAEDALUS_STANDALONE = "1"
  DAEDALUS_DATA = "/data"
  DAEDALUS_PLAYGROUND = "/data/playground"
  HOST = "0.0.0.0"
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[mounts]]
  source = "daedalus_data"
  destination = "/data"
