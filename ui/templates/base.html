<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Дедал · Daedalus{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            argos: {
              bg: '#05070d',
              panel: '#0b1220',
              panel2: '#111a2e',
              border: '#1e2a44',
              accent: '#22d3ee',
              accent2: '#34d399',
              danger: '#f43f5e',
              warn: '#facc15',
              dim: '#64748b',
            },
          },
          boxShadow: {
            glow: '0 0 0 1px rgba(34,211,238,0.25), 0 0 24px rgba(34,211,238,0.15)',
          },
        },
      },
    };
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Daedalus" />
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    body {
      background-image:
        radial-gradient(1000px 500px at 80% -10%, rgba(34,211,238,0.08), transparent 60%),
        radial-gradient(800px 400px at -10% 30%, rgba(52,211,153,0.06), transparent 60%);
      background-color: #05070d;
    }
    .grid-bg {
      background-image:
        linear-gradient(rgba(30,42,68,0.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,42,68,0.35) 1px, transparent 1px);
      background-size: 32px 32px;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen text-slate-200 font-sans antialiased">
  <div class="min-h-screen flex flex-col">
    {% block layout %}{% endblock %}
  </div>
</body>
</html>
