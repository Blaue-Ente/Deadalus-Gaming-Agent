[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus"
version = "0.3.8"
description = "Daedalus — independent coding agent (games first, apps second, verify while building)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daedalus Contributors" }]
keywords = ["daedalus", "coding-agent", "games", "godot", "playground"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "chromadb>=1.0.0",
    "openai>=1.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://gitlab.com/Blaue-Ente/deadalus-agent-0"
Issues = "https://gitlab.com/Blaue-Ente/deadalus-agent-0/-/issues"
Changelog = "https://gitlab.com/Blaue-Ente/deadalus-agent-0/-/blob/main/CHANGELOG.md"

[project.optional-dependencies]
playwright = ["playwright>=1.60.0"]
computer = ["smolvm>=0.0.30"]
gui = ["pywebview>=5.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "mypy>=1.11.0", "pytest-cov>=5.0.0"]

[project.scripts]
daedalus = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["daedalus*", "app*"]

[tool.setuptools.package-data]
daedalus = ["skills/*.md", "knowledge/*.md"]

[tool.pytest.ini_options]
markers = [
    "docker: live docker daemon and daedalus-exec image (not in the default CI job)",
    "playwright: Chromium / playwright extra (not in the default CI job)",
    "live_engine: live Godot / Unity / Blender binaries (not in the default CI job)",
]

[tool.coverage.run]
source = ["daedalus"]
branch = false

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["daedalus/agent.py"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

# Preserved leftover hole (P0.13). tests/test_tool_loop.py asserts this F821.
# Do not "fix" messages.append in the breaker — that is the leftover ladder.
[tool.ruff.lint.per-file-ignores]
"daedalus/tool_loop.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
follow_imports = "skip"
# Staged set only. agent.py / leftover leaves stay off this list.
files = [
    "daedalus/game_build_contract.py",
    "daedalus/game_agent_bench.py",
    "daedalus/engine_runners.py",
    "daedalus/quality_gate.py",
    "daedalus/model_router.py",
    "daedalus/run_engine.py",
    "daedalus/tool_protocol.py",
    "daedalus/need_scan.py",
    "daedalus/contracts/tools.py",
    "daedalus/contracts/commands.py",
    "daedalus/run_state.py",
    "daedalus/event_log.py",
    "daedalus/execution_backends.py",
    "daedalus/docker_sandbox.py",
    "daedalus/command_adapt.py",
]
