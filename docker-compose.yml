# Дедал — Studio на /   Command Center на /admin/daedalus
# HOST=0.0.0.0 requires DAEDALUS_TOKEN in .env (python3 -c "import secrets; print(secrets.token_urlsafe(32))")
services:
  daedalus:
    build: .
    ports:
      - "8787:8787"
    environment:
      DAEDALUS_STANDALONE: "1"
      DAEDALUS_DATA: /var/lib/daedalus
      DAEDALUS_PLAYGROUND: /var/lib/daedalus/playground
      HOST: 0.0.0.0
      PORT: "8787"
      DAEDALUS_TOKEN: ${DAEDALUS_TOKEN:-}
      ALLTOKEN_API_KEY: ${ALLTOKEN_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NOVITA_API_KEY: ${NOVITA_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      IYVERIS_MESH_KEY: ${IYVERIS_MESH_KEY:-iyveris-mesh-dev-key}
    volumes:
      - daedalus-data:/var/lib/daedalus
    restart: unless-stopped

volumes:
  daedalus-data:
