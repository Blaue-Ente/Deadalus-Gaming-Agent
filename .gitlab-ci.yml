# CI for Daedalus — this directory is the product root.
stages: [test, build]

ruff:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir ruff
    - ruff check daedalus/tool_protocol.py daedalus/model_router.py daedalus/run_engine.py daedalus/need_scan.py daedalus/game_build_contract.py daedalus/game_agent_bench.py tests/test_harness_kernel.py
    - ruff check --select E9,F63,F7,F82 --exclude daedalus/agent.py daedalus app tests
  rules:
    - if: $CI_COMMIT_BRANCH

pytest:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir -e ".[dev]"
    - python3 -m pytest tests -q
  rules:
    - if: $CI_COMMIT_BRANCH

build-image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t daedalus:ci .
    - |
      if [ -n "${CI_REGISTRY:-}" ] && [ -n "${CI_REGISTRY_USER:-}" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        docker tag daedalus:ci "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        docker tag daedalus:ci "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH
