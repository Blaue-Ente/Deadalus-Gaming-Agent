# CI for Daedalus — this directory is the product root.
#
# Default pytest does NOT use Docker-in-Docker. Live docker tests are optional.
# Without docker the required jobs stay fail-closed:
#   - DockerBackend / run_in_docker unit tests must still refuse (no Local fall-through)
#   - @pytest.mark.docker is excluded from the required pytest job
#   - ruff / mypy / uv-lock / coverage / secret-scan / pip-audit / trivy-fs need no daemon
# build-image is the only DinD job and is not a required merge gate.
#
# Branch protection (owner applies in GitLab settings — this file cannot):
#   protect main, no force-push, merge only via MR, pipelines must succeed.
#   Required jobs: ruff, mypy, uv-lock, pytest, secret-scan, pip-audit.
#   Do not require build-image, trivy-image, or pytest-docker.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [lint, test, audit, build]

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

.python:
  image: python:3.12-slim
  variables:
    DAEDALUS_STANDALONE: "1"
    DAEDALUS_MENTOR: "0"
    DAEDALUS_VISUAL_PROOF: "0"
    DAEDALUS_RUN_BUDGET: "off"
    DAEDALUS_MCP_POLICY: "enforce"
    ALLTOKEN_API_KEY: ""
    OPENROUTER_API_KEY: ""
    NOVITA_API_KEY: ""
    NVIDIA_API_KEY: ""
    DAEDALUS_API_KEY: ""

.ci_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

ruff:
  extends: [.python, .ci_rules]
  stage: lint
  script:
    - pip install --no-cache-dir ruff
    - ruff check daedalus app tests

mypy:
  extends: [.python, .ci_rules]
  stage: lint
  script:
    - pip install --no-cache-dir mypy
    - python3 -m mypy

uv-lock:
  extends: [.python, .ci_rules]
  stage: lint
  script:
    - pip install --no-cache-dir uv
    - python3 -m uv lock --check

pytest:
  extends: [.python, .ci_rules]
  stage: test
  script:
    - pip install --no-cache-dir -e ".[dev]"
    - >
      python3 -m pytest tests -q -m "not docker and not playwright"
      --cov=daedalus --cov-report=term-missing --cov-report=xml:coverage.xml
      --cov-fail-under=45 --junitxml=test-results.xml
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - test-results.xml
  coverage: '/TOTAL.*?(\d+%)/'

# Optional. Not a required gate. Default runners have no docker socket.
pytest-docker:
  extends: [.python]
  stage: test
  allow_failure: true
  rules:
    - if: $DAEDALUS_CI_DOCKER == "1"
    - when: manual
      allow_failure: true
  script:
    - pip install --no-cache-dir -e ".[dev]"
    - python3 -m pytest tests -q -m docker

secret-scan:
  extends: [.python, .ci_rules]
  stage: audit
  script:
    - python3 scripts/secret_scan.py
  artifacts:
    when: on_failure
    expire_in: 14 days
    paths:
      - secret-scan.txt

pip-audit:
  extends: [.python, .ci_rules]
  stage: audit
  script:
    - pip install --no-cache-dir -e "." pip-audit
    - python3 -m pip_audit --progress-spinner off --format json --output pip-audit.json
    - python3 -m pip_audit --progress-spinner off
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - pip-audit.json

# Filesystem / Dockerfile scan. No DinD. Missing scanner image fails the job.
trivy-fs:
  extends: .ci_rules
  stage: audit
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  script:
    - >
      trivy fs --exit-code 1 --severity HIGH,CRITICAL
      --skip-dirs .git --skip-dirs artifacts --scanners vuln,misconfig
      --format table --output trivy-fs.txt .
    - cat trivy-fs.txt
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - trivy-fs.txt

# DinD — image only. Not required for merge. Not attached to default pytest.
build-image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t daedalus:ci .
    - |
      if [ -n "${CI_REGISTRY:-}" ] && [ -n "${CI_REGISTRY_USER:-}" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        docker tag daedalus:ci "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        docker tag daedalus:ci "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
